# Selenium Test Configuration

# Browser Settings
browser.name=chrome
browser.headless=false
browser.window.maximize=true

# Application URLs
app.url=https://www.google.com

# Timeouts (in seconds)
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# Screenshot Settings
screenshot.on.failure=true
screenshot.path=target/screenshots/

# Report Settings
report.path=target/extent-reports/
report.theme=dark

# Logging
log.level=INFO
